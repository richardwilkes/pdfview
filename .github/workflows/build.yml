name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One runner per OS plus both architectures on Linux. The parity tests assert exact integer geometry, so
        # amd64 and arm64 together catch floating-point divergence between them.
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-26, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Lint through the official action rather than build.sh --lint: the script downloads golangci-lint through the
      # upstream install.sh, whose checksum verification fails for unauthenticated release downloads in CI.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # The library must build without cgo. The race-enabled test run below needs cgo, so it cannot catch a cgo
      # dependency on its own.
      - name: Verify cgo-free build
        run: CGO_ENABLED=0 go build ./...

      - name: build.sh
        run: ./build.sh --race
